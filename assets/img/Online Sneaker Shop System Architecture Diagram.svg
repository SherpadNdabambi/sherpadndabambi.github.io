<svg height="360" viewBox="0 0 770 360" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif; font-size: 13px">

  <!-- Start Marker Definition for Arrows -->
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">

      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />

    </marker>

  </defs>
  <!-- End Marker Definition for Arrows -->

  <!-- Start Background Grid/Box -->
  <rect x="10" y="10" width="750" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <!-- End Background Grid/Box -->

  <!-- Start Client Browser -->
  <rect x="40" y="140" width="140" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />

  <text x="110" y="175" text-anchor="middle" font-weight="bold" fill="#1e3a8a">
    Client Browser
  </text>

  <text x="110" y="195" text-anchor="middle" fill="#3b82f6" font-size="11">
    React SPA Client
  </text>
  <!-- End Client Browser -->

  <!-- Start Arrow Client to Frontend Host -->
  <path d="M 180 160 L 250 100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <text x="210" y="150" font-size="11" fill="#475569">HTTPS</text>
  <!-- End Arrow Client to Frontend Host -->

  <!-- Start Frontend Hosting -->
  <rect x="260" y="60" width="160" height="75" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />

  <text x="340" y="95" text-anchor="middle" font-weight="bold" fill="#14532d">
    Frontend Hosting
  </text>

  <text x="340" y="115" text-anchor="middle" fill="#16a34a" font-size="11">
    Edge CDN Distribution
  </text>
  <!-- End Frontend Hosting -->

  <!-- Start Arrow Client to API -->
  <path d="M 180 190 L 250 240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <text x="160" y="240" font-size="11" fill="#475569">
    REST / JSON
  </text>
  <!-- End Arrow Client to API -->

  <!-- Start Backend API Service -->
  <rect x="260" y="210" width="160" height="85" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" />

  <text x="340" y="245" text-anchor="middle" font-weight="bold" fill="#78350f">
    Backend API Service
  </text>

  <text x="340" y="265" text-anchor="middle" fill="#b45309" font-size="11">
    Node.js / Express Server
  </text>
  <!-- End Backend API Service -->

  <!-- Start Arrow API to Object Storage -->
  <path d="M 420 220 L 540 120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <text x="475" y="185" font-size="11" fill="#475569">
    S3 SDK / Media
  </text>
  <!-- End Arrow API to Object Storage -->

  <!-- Start Cloud Object Storage -->
  <rect x="550" y="60" width="180" height="75" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" />

  <text x="640" y="95" text-anchor="middle" font-weight="bold" fill="#1e293b">
    Cloud Object Storage
  </text>

  <text x="640" y="115" text-anchor="middle" fill="#475569" font-size="11">
    Product Images Asset Store
  </text>
  <!-- End Cloud Object Storage -->

  <!-- Start Arrow API to DB -->
  <path d="M 420 252.5 L 540 252.5" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <text x="435" y="270" font-size="11" fill="#475569">
    Pooled SSL SQL
  </text>
  <!-- End Arrow API to DB -->

  <!-- Start PostgreSQL Database -->
  <rect x="550" y="210" width="180" height="85" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="2" />

  <text x="640" y="245" text-anchor="middle" font-weight="bold" fill="#701a75">
    Neon PostgreSQL
  </text>

  <text x="640" y="265" text-anchor="middle" fill="#a21caf" font-size="11">
    Serverless Database
  </text>
  <!-- End PostgreSQL Database -->

</svg>